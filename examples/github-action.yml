name: MCP Security

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  security-events: write

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      # For pull_request events we can diff BASE vs HEAD. For push/manual
      # triggers there is no meaningful "base" to diff against, so we fall
      # back to a single-tree scan (base-path left unset below) -- this is
      # a real scan, not a fake diff.
      - name: Checkout HEAD
        uses: actions/checkout@v4
        with:
          path: head

      - name: Checkout BASE (pull_request only)
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base

      - name: MCP Security Check
        id: mcp_check
        uses: rudimentall1/MCP-Security-Check-for-GitHub@130b587c8ca5e001550838b16eb6e77693d40e7c
        with:
          path: head
          base-path: ${{ github.event_name == 'pull_request' && 'base' || '' }}
          fail-on: critical

      # Fork-originated pull requests use a read-only token. The scan still
      # runs, but these repository-write side effects are skipped for forks.
      - name: Upload SARIF
        if: always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: ${{ steps.mcp_check.outputs.sarif-path }}

      - name: Post report as PR comment
        if: always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('${{ steps.mcp_check.outputs.report-path }}', 'utf8');
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body,
            });

