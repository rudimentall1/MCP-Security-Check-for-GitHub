name: "MCP Security Check"
description: "Scan MCP servers, AI-agent permissions and attack paths before merging a GitHub pull request."
author: "MCP Security Check Contributors"

branding:
  icon: "shield"
  color: "purple"

inputs:
  path:
    description: "Directory to scan (HEAD checkout). Defaults to the workflow workspace."
    required: false
    default: "."

  base-path:
    description: "Optional directory containing the BASE branch checkout. When set, runs a capability diff (BASE vs HEAD)."
    required: false
    default: ""

  config:
    description: "Path to a policy YAML file."
    required: false
    default: ""

  format:
    description: "Primary report format: markdown | json | sarif | terminal."
    required: false
    default: "markdown"

  fail-on:
    description: "Severity threshold: critical|high|medium|low|info."
    required: false
    default: "high"

outputs:
  decision:
    description: "ALLOW, WARN, or BLOCK from the authoritative analysis run."
    value: ${{ steps.run_check.outputs.decision }}

  risk-score:
    description: "Risk score from 0 to 100."
    value: ${{ steps.run_check.outputs.risk-score }}

  report-path:
    description: "Path to the primary generated report."
    value: ${{ steps.run_check.outputs.report-path }}

  sarif-path:
    description: "Path to the generated SARIF report."
    value: ${{ steps.run_check.outputs.sarif-path }}

runs:
  using: "composite"

  steps:
    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
      with:
        python-version: "3.11"

    - name: Install MCP Security Check
      shell: bash
      run: |
        set -euo pipefail
        python -m pip install "${{ github.action_path }}"

    # -----------------------------------------------------------------------
    # ONE authoritative security analysis.
    #
    # The scanner generates:
    #   mcp-security-report.json
    #   mcp-security-report.md
    #   mcp-security-results.sarif
    #
    # IMPORTANT:
    # scanner exit codes are deliberately captured with set +e.
    # Otherwise bash -e can terminate the composite action before $? is read.
    # -----------------------------------------------------------------------
    - name: Run MCP Security Check
      id: run_check
      shell: bash
      run: |
        set -euo pipefail

        JSON_FILE="mcp-security-report.json"
        SARIF_FILE="mcp-security-results.sarif"
        MD_FILE="mcp-security-report.md"

        CONFIG_ARGS=()

        if [ -n "${{ inputs.config }}" ]; then
          CONFIG_ARGS=(--config "${{ inputs.config }}")
        fi

        exit_code=0

        if [ -n "${{ inputs.base-path }}" ]; then
          echo "Running capability diff:"
          echo "  BASE: ${{ inputs.base-path }}"
          echo "  HEAD: ${{ inputs.path }}"

          set +e

          mcp-security-check diff \
            "${{ inputs.base-path }}" \
            "${{ inputs.path }}" \
            --format json \
            --output "$JSON_FILE" \
            --sarif-output "$SARIF_FILE" \
            --markdown-output "$MD_FILE" \
            --fail-on "${{ inputs.fail-on }}" \
            "${CONFIG_ARGS[@]}"

          exit_code=$?

          set -e
        else
          echo "Running single-tree scan:"
          echo "  PATH: ${{ inputs.path }}"

          set +e

          mcp-security-check scan \
            "${{ inputs.path }}" \
            --format json \
            --output "$JSON_FILE" \
            --sarif-output "$SARIF_FILE" \
            --markdown-output "$MD_FILE" \
            --fail-on "${{ inputs.fail-on }}" \
            "${CONFIG_ARGS[@]}"

          exit_code=$?

          set -e
        fi

        echo "Scanner exit code: $exit_code"

        # The scanner must always produce JSON.
        if [ ! -f "$JSON_FILE" ]; then
          echo "ERROR: MCP Security Check did not produce $JSON_FILE" >&2
          echo "exit_code=3" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        # Read decision and risk score from the exact JSON report generated
        # by this same scanner invocation.
        DECISION=$(python3 -c "
        import json
        with open('$JSON_FILE', encoding='utf-8') as f:
            data = json.load(f)
        print(data['decision'])
        ")

        SCORE=$(python3 -c "
        import json
        with open('$JSON_FILE', encoding='utf-8') as f:
            data = json.load(f)
        print(data['risk_score'])
        ")

        REPORT_PATH="$MD_FILE"

        if [ "${{ inputs.format }}" = "json" ]; then
          REPORT_PATH="$JSON_FILE"
        elif [ "${{ inputs.format }}" = "sarif" ]; then
          REPORT_PATH="$SARIF_FILE"
        fi

        echo "decision=$DECISION" >> "$GITHUB_OUTPUT"
        echo "risk-score=$SCORE" >> "$GITHUB_OUTPUT"
        echo "report-path=$REPORT_PATH" >> "$GITHUB_OUTPUT"
        echo "sarif-path=$SARIF_FILE" >> "$GITHUB_OUTPUT"
        echo "exit_code=$exit_code" >> "$GITHUB_OUTPUT"

        echo "Decision: $DECISION"
        echo "Risk score: $SCORE"
        echo "Report: $REPORT_PATH"
        echo "SARIF: $SARIF_FILE"

    # -----------------------------------------------------------------------
    # BLOCK and scanner/configuration errors fail the workflow.
    # WARN intentionally remains green.
    # -----------------------------------------------------------------------
    - name: Fail workflow according to policy
      shell: bash
      run: |
        set -euo pipefail

        code="${{ steps.run_check.outputs.exit_code }}"
        decision="${{ steps.run_check.outputs.decision }}"

        echo "MCP Security Check"
        echo "Decision: $decision"
        echo "Exit code: $code"

        case "$code" in
          0)
            echo "ALLOW -> workflow continues."
            ;;
          1)
            echo "WARN -> workflow continues."
            ;;
          2)
            echo "BLOCK -> failing workflow."
            exit 1
            ;;
          3)
            echo "ERROR -> failing workflow."
            exit 1
            ;;
          *)
            echo "Unknown scanner exit code: $code"
            exit 1
            ;;
        esac