name: Python Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Validate Action and workflow YAML
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml

          files = [
              "action.yml",
              ".github/workflows/action-self-test.yml",
              ".github/workflows/python-tests.yml",
              "examples/github-action.yml",
              "rules/default.yaml",
              ".github/dependabot.yml",
          ]
          for name in files:
              data = yaml.safe_load(Path(name).read_text(encoding="utf-8"))
              assert isinstance(data, dict), f"{name} must be a YAML mapping"
              print(f"OK: {name}")
          PY

      - name: Run test suite
        run: python -m pytest -q

  build-package:
    name: Build and smoke-test package
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"

      - name: Build and validate distributions
        run: |
          python -m pip install --upgrade build twine
          python -m build
          python -m twine check dist/*

      - name: Install wheel in a clean virtual environment and smoke-test CLI
        shell: bash
        run: |
          set -euo pipefail

          VENV="$RUNNER_TEMP/mcp-security-smoke"
          FIXTURE="$RUNNER_TEMP/mcp-security-fixture"
          REPORT="$RUNNER_TEMP/mcp-security-report.json"

          python -m venv "$VENV"
          "$VENV/bin/python" -m pip install dist/*.whl

          mkdir -p "$FIXTURE"
          cp examples/safe-mcp.json "$FIXTURE/mcp.json"

          "$VENV/bin/mcp-security-check" scan "$FIXTURE" --format json > "$REPORT"
          "$VENV/bin/python" - "$REPORT" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as f:
              report = json.load(f)
          assert report["decision"] == "ALLOW", report
          assert report["scanned_files"] == ["mcp.json"], report
          print("OK: installed wheel scans a safe MCP config and returns ALLOW")
          PY
