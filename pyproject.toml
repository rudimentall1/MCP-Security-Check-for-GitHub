[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-security-check"
version = "0.1.0"
description = "Scan MCP servers, AI-agent permissions and attack paths before merging a GitHub pull request."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "MCP Security Check Contributors" }]
dependencies = [
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[project.scripts]
mcp-security-check = "mcp_security.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
# src-layout fix: pytest's rootdir-based sys.path insertion does not see
# packages under src/ unless the package is installed (editable or not).
# The native `pythonpath` ini option (pytest >= 7.0, no plugin required)
# adds src/ to sys.path for test collection, so `pytest` works right after
# `git clone` without requiring `pip install -e .` first. Installing the
# package is still recommended for normal use (see README), but tests no
# longer *require* it.
pythonpath = ["src"]
testpaths = ["tests"]
